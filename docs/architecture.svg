<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="AgentShield architecture">
  <rect width="960" height="560" fill="#0a0a0a"/>
  <text x="40" y="40" fill="#8a8a8a" font-family="monospace" font-size="12">AGENTSHIELD × STRANDS · PROFESSIONAL AGENTS · AGENTS FOR HUMANS</text>
  <text x="40" y="72" fill="#f0f0f0" font-family="sans-serif" font-size="22" font-weight="600">Architecture</text>

  <rect x="40" y="100" width="200" height="70" fill="#111" stroke="#333"/>
  <text x="50" y="128" fill="#8a8a8a" font-family="monospace" font-size="10">HUMAN OPERATOR</text>
  <text x="50" y="150" fill="#f0f0f0" font-family="sans-serif" font-size="13">Intent / approval</text>

  <rect x="280" y="100" width="220" height="70" fill="#111" stroke="#333"/>
  <text x="290" y="128" fill="#8a8a8a" font-family="monospace" font-size="10">TRADING AGENT</text>
  <text x="290" y="150" fill="#f0f0f0" font-family="sans-serif" font-size="13">Proposes tx + provenance</text>

  <path d="M240 135 H280" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 135 H540" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="80" width="380" height="200" fill="#111" stroke="#f0f0f0" stroke-width="1.5"/>
  <text x="555" y="105" fill="#8a8a8a" font-family="monospace" font-size="10">STRANDS AGENTS SDK LOOP</text>
  <text x="555" y="128" fill="#f0f0f0" font-family="sans-serif" font-size="14" font-weight="600">AgentShield Professional Agent</text>
  <text x="555" y="155" fill="#a3a3a3" font-family="sans-serif" font-size="12">Bedrock (default) or SpaceXAI / OpenAI</text>
  <text x="555" y="185" fill="#3dd68c" font-family="monospace" font-size="11">tools: scan_injection · honeypot · CTI</text>
  <text x="555" y="205" fill="#3dd68c" font-family="monospace" font-size="11">gate1 · gate2 · finalize · notify</text>
  <text x="555" y="235" fill="#a3a3a3" font-family="sans-serif" font-size="12">Surfaces human only on BLOCK / QUARANTINE</text>
  <text x="555" y="255" fill="#a3a3a3" font-family="sans-serif" font-size="12">Never sees trading-agent chat</text>

  <path d="M730 280 V320" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="320" width="280" height="90" fill="#111" stroke="#333"/>
  <text x="50" y="348" fill="#8a8a8a" font-family="monospace" font-size="10">GATE 1 · DETERMINISTIC</text>
  <text x="50" y="372" fill="#f0f0f0" font-family="sans-serif" font-size="12">Caps · lists · Morse/stego</text>
  <text x="50" y="392" fill="#f0f0f0" font-family="sans-serif" font-size="12">Honeypot / drainer IOC</text>

  <rect x="340" y="320" width="280" height="90" fill="#111" stroke="#333"/>
  <text x="350" y="348" fill="#8a8a8a" font-family="monospace" font-size="10">GATE 2 · ADVERSARIAL</text>
  <text x="350" y="372" fill="#f0f0f0" font-family="sans-serif" font-size="12">Hijack likelihood on</text>
  <text x="350" y="392" fill="#f0f0f0" font-family="sans-serif" font-size="12">tx + provenance only</text>

  <rect x="640" y="320" width="280" height="90" fill="#111" stroke="#333"/>
  <text x="650" y="348" fill="#8a8a8a" font-family="monospace" font-size="10">CTI-AGENT + ELASTIC</text>
  <text x="650" y="372" fill="#f0f0f0" font-family="sans-serif" font-size="12">IOC feed · Security events</text>
  <text x="650" y="392" fill="#f0f0f0" font-family="sans-serif" font-size="12">Flight Recorder SOC UI</text>

  <path d="M180 410 V450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M480 410 V450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M780 410 V450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="450" width="880" height="70" fill="#161616" stroke="#333"/>
  <text x="50" y="480" fill="#8a8a8a" font-family="monospace" font-size="10">OUTCOME</text>
  <text x="50" y="505" fill="#3dd68c" font-family="sans-serif" font-size="14">ALLOW</text>
  <text x="140" y="505" fill="#ff4d4d" font-family="sans-serif" font-size="14">BLOCK</text>
  <text x="240" y="505" fill="#f5a524" font-family="sans-serif" font-size="14">QUARANTINE</text>
  <text x="400" y="505" fill="#a3a3a3" font-family="sans-serif" font-size="13">→ TEE signer / x402 receipt / operator notify</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
</svg>
